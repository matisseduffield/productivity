name: Check

# Runs the unit tests and lint on every push to main and on pull requests,
# so a broken change shows up before a release tag is pushed. Uses the debug
# variant: no signing secrets are needed or exposed here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :app:testGithubDebugUnitTest :app:lintGithubDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-githubDebug.html
          if-no-files-found: ignore
